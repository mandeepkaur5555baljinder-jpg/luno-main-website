<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Luno — a personal AI that feels like yours</title>
  <meta name="description"
    content="Luno is a personal AI assistant for chat, voice, vision, and code, built solo by one developer. Open it in your browser today, or add it to your iPhone home screen." />

  <meta name="google-site-verification" content="TmtvCHehvRWuewzKmibkrRtkle0wikRoF5Tfv3z1Zos" />

  <meta property="og:title" content="Luno — a personal AI that feels like yours" />
  <meta property="og:description" content="A personal AI assistant for chat, voice, vision, and code. Live today at app.lunoai.in." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.lunoai.in/" />

  <link rel="canonical" href="https://www.lunoai.in/" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#07060d" />

  <style>
    body {
      margin: 0;
      background-color: #07060d;
      overflow: hidden;
    }

    @keyframes skeleton-pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.4; }
    }

    .sk-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 12px;
      animation: skeleton-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    #initial-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #07060d;
      display: flex;
      flex-direction: column;
      padding: 24px;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    .sk-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      height: 64px;
    }

    .sk-hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 100%;
      max-width: 768px;
      margin: 0 auto;
      gap: 24px;
    }

    @media (max-width: 768px) {
      .sk-nav { display: none !important; }
      .sk-hero-title { height: 120px !important; }
      .sk-hero-buttons { flex-direction: column; gap: 12px !important; }
      .sk-hero-buttons .sk-box { width: 100% !important; }
    }
  </style>
</head>

<body>
  <div id="initial-loader">
    <div class="sk-header">
      <div class="sk-box" style="width: 100px; height: 34px"></div>

      <div class="sk-nav" style="display: flex; gap: 32px">
        <div class="sk-box" style="width: 60px; height: 16px"></div>
        <div class="sk-box" style="width: 60px; height: 16px"></div>
        <div class="sk-box" style="width: 80px; height: 16px"></div>
      </div>

      <div class="sk-box" style="width: 130px; height: 40px"></div>
    </div>

    <div class="sk-hero">
      <div class="sk-box" style="width: 200px; height: 30px; border-radius: 20px"></div>
      <div class="sk-box sk-hero-title" style="width: 90%; height: 150px; border-radius: 14px"></div>
      <div class="sk-box" style="width: 60%; height: 22px"></div>

      <div class="sk-hero-buttons" style="display: flex; gap: 16px; margin-top: 16px">
        <div class="sk-box" style="width: 160px; height: 48px; border-radius: 10px"></div>
        <div class="sk-box" style="width: 180px; height: 48px; border-radius: 10px"></div>
      </div>
    </div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
